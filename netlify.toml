# Netlify Deployment Configuration for Land And Beyond
[build]
  publish = "."

[[redirects]]
  from = "/farmland"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/launches"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/news"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/approvals"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/calculator"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/compare"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/matcher"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
