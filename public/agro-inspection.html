<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Agro & Soil Inspection | Land & Beyond</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; margin: 0; padding: 0; }
    .form-container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .form-card { background: #ffffff; border-radius: 24px; border: 1px solid #e2e8f0; padding: 36px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    .input-box { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 14px; }
    .btn-submit { width: 100%; padding: 14px; border-radius: 12px; background: #10b981; color: #fff; font-size: 15px; font-weight: 700; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="form-card">
      <div style="margin-bottom: 16px;"><a href="index.html" style="text-decoration: none; color: #64748b; font-weight: 700; font-size: 13px;">← Back to Home</a></div>
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #ecfdf5; border: 1px solid #a7f3d0; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
          <span style="font-size: 26px;">🌾</span>
        </div>
        <h2 style="margin: 0 0 6px; font-size: 1.45rem; font-weight: 800; color: #0f172a;">Schedule Agro &amp; Soil Inspection</h2>
        <p style="margin: 0; font-size: 13px; color: #64748b;">Soil Profile, Borewell Telemetry &amp; Patta Boundary Audit</p>
      </div>

      <form onsubmit="handleAgroSubmit(event)">
        <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 4px;">Farmland Corridor Parcel *</label>
        <input type="text" id="parcelName" class="input-box" required style="background: #f8fafc; font-weight: 700;" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 4px;">Full Name *</label>
            <input type="text" id="agroName" class="input-box" required placeholder="e.g. Anandha Krishnan" />
          </div>
          <div>
            <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 4px;">Mobile Number *</label>
            <input type="tel" id="agroPhone" class="input-box" pattern="[0-9]{10}" required placeholder="98421 88421" />
          </div>
        </div>

        <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 4px;">Inspection Date *</label>
        <input type="date" id="agroDate" class="input-box" required />

        <button type="submit" class="btn-submit">Confirm Agro Inspection Slot &rarr;</button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pName = params.get('parcel') || 'Farmcrest Agro Dry Land Parcel (Sulur Corridor)';
    document.getElementById('parcelName').value = decodeURIComponent(pName);

    const tmr = new Date();
    tmr.setDate(tmr.getDate() + 1);
    document.getElementById('agroDate').value = tmr.toISOString().split('T')[0];

    function handleAgroSubmit(e) {
      e.preventDefault();
      const parcel = document.getElementById('parcelName').value;
      const name = document.getElementById('agroName').value;
      const phone = document.getElementById('agroPhone').value;
      const date = document.getElementById('agroDate').value;

      let leads = JSON.parse(localStorage.getItem('lb_site_tours_data') || '[]');
      leads.unshift({
        id: 'inq_' + Date.now(),
        customerName: name,
        contact: `+91 ${phone}`,
        phone: `+91 ${phone}`,
        propertyRequested: `[Agro Audit] ${parcel}`,
        preferredDate: `${date} (Agro Inspection)`,
        pickupNeeded: true,
        status: 'New Lead',
        createdAt: new Date().toISOString()
      });
      localStorage.setItem('lb_site_tours_data', JSON.stringify(leads));

      alert(`✅ Agro Farmland Inspection Confirmed!\n\nParcel: ${parcel}\nDate: ${date}\nGuest: ${name}\n\nOur agronomy specialist will accompany your inspection.`);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
